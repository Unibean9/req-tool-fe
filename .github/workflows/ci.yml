name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE_NAME: req-tool-fe
  NEXT_PUBLIC_API_URL: http://api-req.bean9.net
  NEXT_PUBLIC_APP_URL: https://req.bean9.net
  NEXT_PUBLIC_COOKIE_DOMAIN: .bean9.net
  NEXT_PUBLIC_ENV: production
  NEXT_PUBLIC_POST_LOGIN_PATH: /dashboard
  NEXT_PUBLIC_SEO_SUBJECTS_PATH: /subjects

jobs:
  docker-validate:
    name: Docker / Validate Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_COOKIE_DOMAIN=${{ env.NEXT_PUBLIC_COOKIE_DOMAIN }}
            NEXT_PUBLIC_ENV=${{ env.NEXT_PUBLIC_ENV }}
            NEXT_PUBLIC_POST_LOGIN_PATH=${{ env.NEXT_PUBLIC_POST_LOGIN_PATH }}
            NEXT_PUBLIC_SEO_SUBJECTS_PATH=${{ env.NEXT_PUBLIC_SEO_SUBJECTS_PATH }}
          tags: ${{ env.DOCKER_IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  deploy:
    name: Deploy
    needs: [docker-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        run: |
          test -n "$DOCKER_USERNAME" || { echo "DOCKER_USERNAME secret is required"; exit 1; }
          test -n "$DOCKER_PASSWORD" || { echo "DOCKER_PASSWORD secret is required"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          pull: true
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_COOKIE_DOMAIN=${{ env.NEXT_PUBLIC_COOKIE_DOMAIN }}
            NEXT_PUBLIC_ENV=${{ env.NEXT_PUBLIC_ENV }}
            NEXT_PUBLIC_POST_LOGIN_PATH=${{ env.NEXT_PUBLIC_POST_LOGIN_PATH }}
            NEXT_PUBLIC_SEO_SUBJECTS_PATH=${{ env.NEXT_PUBLIC_SEO_SUBJECTS_PATH }}
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
