name: Docker Publish

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: req-tool-fe
  NEXT_PUBLIC_API_URL: http://api-req.bean9.net/
  NEXT_PUBLIC_APP_URL: https://req-tool.example.com
  NEXT_PUBLIC_COOKIE_DOMAIN: .req-tool.example.com
  NEXT_PUBLIC_ENV: production
  NEXT_PUBLIC_POST_LOGIN_PATH: /dashboard
  NEXT_PUBLIC_SEO_SUBJECTS_PATH: /subjects

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_COOKIE_DOMAIN=${{ env.NEXT_PUBLIC_COOKIE_DOMAIN }}
            NEXT_PUBLIC_ENV=${{ env.NEXT_PUBLIC_ENV }}
            NEXT_PUBLIC_POST_LOGIN_PATH=${{ env.NEXT_PUBLIC_POST_LOGIN_PATH }}
            NEXT_PUBLIC_SEO_SUBJECTS_PATH=${{ env.NEXT_PUBLIC_SEO_SUBJECTS_PATH }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retry build and push on failure
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_COOKIE_DOMAIN=${{ env.NEXT_PUBLIC_COOKIE_DOMAIN }}
            NEXT_PUBLIC_ENV=${{ env.NEXT_PUBLIC_ENV }}
            NEXT_PUBLIC_POST_LOGIN_PATH=${{ env.NEXT_PUBLIC_POST_LOGIN_PATH }}
            NEXT_PUBLIC_SEO_SUBJECTS_PATH=${{ env.NEXT_PUBLIC_SEO_SUBJECTS_PATH }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}

      - name: Verify image is pullable
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}

      - name: Summary
        run: |
          echo "Image pushed: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }} (also tagged latest)"
          echo "Deploy is manual for this repo: go to Dokploy dashboard -> req-tool-fe -> Deploy."
