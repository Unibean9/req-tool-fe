x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  app:
    image: ${DOCKER_USERNAME:?DOCKER_USERNAME is required}/req-tool-fe:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: ${COMPOSE_CONTAINER_PREFIX:-reqflow}-fe
    restart: unless-stopped
    init: true
    mem_limit: ${REQ_TOOL_FE_MEM_LIMIT:-512m}
    cpus: 1.0
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      NEXT_PUBLIC_COOKIE_DOMAIN: ${NEXT_PUBLIC_COOKIE_DOMAIN:?NEXT_PUBLIC_COOKIE_DOMAIN is required}
      NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-production}
      NEXT_PUBLIC_POST_LOGIN_PATH: ${NEXT_PUBLIC_POST_LOGIN_PATH:-/dashboard}
      NEXT_PUBLIC_SEO_SUBJECTS_PATH: ${NEXT_PUBLIC_SEO_SUBJECTS_PATH:-/subjects}
    ports:
      - '${APP_PORT:-5174}:5174'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5174/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
